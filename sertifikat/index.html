<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Sertifikat - Ma'arif NU Kabupaten Pasuruan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#087f5b;--green-dark:#075e45;--green-light:#12a879;--border:rgba(255,255,255,.45);--shadow:0 20px 50px rgba(0,70,45,.18)}
body{min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#123c31;background:radial-gradient(circle at 10% 10%,rgba(36,190,137,.28),transparent 32%),radial-gradient(circle at 90% 20%,rgba(0,128,90,.22),transparent 30%),linear-gradient(135deg,#edf9f4,#d9f3e9 50%,#f5fcf9);padding:25px 15px 50px}
.container{max-width:1100px;margin:auto}.header{text-align:center;margin-bottom:25px}
.logo{width:90px;height:90px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 8px 15px rgba(0,80,55,.15))}
.header h1{font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:-1px;color:#075e45}
.header p{margin-top:7px;font-size:14px;color:#4a7568}
.glass{background:rgba(255,255,255,.52);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);border-radius:24px}
.search-box{padding:20px;margin-bottom:20px}
.search{width:100%;border:1px solid rgba(8,127,91,.18);background:rgba(255,255,255,.75);padding:15px 18px;border-radius:14px;outline:none;font-size:15px;color:#174b3d;transition:.25s}
.search:focus{border-color:var(--green-light);box-shadow:0 0 0 4px rgba(18,168,121,.10)}
.data-card{padding:10px;overflow:hidden}.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
thead th{text-align:left;padding:17px 15px;font-size:13px;color:white;background:linear-gradient(135deg,#087f5b,#0a9c6f);white-space:nowrap}
thead th:first-child{border-radius:14px 0 0 0}thead th:last-child{border-radius:0 14px 0 0}
tbody tr{transition:.2s}tbody tr:hover{background:rgba(18,168,121,.08)}
tbody td{padding:16px 15px;border-bottom:1px solid rgba(8,127,91,.10);font-size:14px;vertical-align:middle}
.nama{font-weight:700;color:#075e45}
.cabang{display:inline-block;padding:6px 10px;border-radius:20px;background:rgba(8,127,91,.09);color:#087f5b;font-size:12px;font-weight:600}
.download{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:11px;color:white;background:linear-gradient(135deg,#087f5b,#0aaa76);text-decoration:none;font-size:12px;font-weight:700;box-shadow:0 7px 18px rgba(8,127,91,.20);transition:.25s;white-space:nowrap}
.download:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(8,127,91,.28)}
.download svg{width:15px;height:15px}.status{text-align:center;padding:35px 15px;color:#658b7f;font-size:14px}
.loader{width:30px;height:30px;border:3px solid rgba(8,127,91,.15);border-top-color:#087f5b;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}.empty{padding:40px 20px;text-align:center;color:#71978c}.pagination{display:flex;justify-content:center;align-items:center;gap:7px;padding:20px 10px 10px;flex-wrap:wrap}.page-btn{border:1px solid rgba(8,127,91,.18);background:rgba(255,255,255,.7);color:#087f5b;min-width:38px;height:38px;padding:0 11px;border-radius:10px;font-weight:700;cursor:pointer;transition:.2s}.page-btn:hover{background:rgba(18,168,121,.12);transform:translateY(-1px)}.page-btn.active{background:linear-gradient(135deg,#087f5b,#0aaa76);color:#fff;border-color:transparent;box-shadow:0 6px 15px rgba(8,127,91,.18)}.page-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.page-info{text-align:center;font-size:12px;color:#699085;padding:0 10px 15px}.footer{text-align:center;margin-top:25px;color:#699085;font-size:12px}
@media(max-width:650px){body{padding:18px 10px 35px}.logo{width:75px;height:75px}.header h1{font-size:25px}.header p{font-size:13px}.glass{border-radius:18px}.search-box{padding:13px}.data-card{padding:5px}table{min-width:570px}}
</style>
</head>
<body>
<div class="container">
<header class="header">
<img class="logo" src="https://raw.githubusercontent.com/maarifkabpasuruan/harlah-maarif-97/refs/heads/main/media/Logo_Harlah_LPMNU97.png" alt="Logo Ma'arif NU">
<h1>Sertifikat Peserta</h1>
<p>Ma'arif NU Kabupaten Pasuruan</p>
</header>

<div class="glass search-box">
<input type="search" id="search" class="search" placeholder="🔎  Cari nama lembaga atau cabang lomba...">
</div>

<div class="glass data-card">
<div id="loading" class="status"><div class="loader"></div>Memuat data sertifikat...</div>
<div class="table-wrap">
<table id="dataTable" style="display:none;">
<thead><tr><th>Nama Lembaga</th><th>Cabang Lomba</th><th>Download Sertifikat</th></tr></thead>
<tbody id="dataBody"></tbody>
</table>
</div>
<div id="pagination" class="pagination" style="display:none;"></div>
<div id="pageInfo" class="page-info" style="display:none;"></div>
<div id="empty" class="empty" style="display:none;">Data sertifikat tidak ditemukan.</div>
</div>
<div class="footer">© Ma'arif NU Kabupaten Pasuruan</div>
</div>

<script>
const SHEET_ID="1JeoXOK3RAElokvxh9Vv4q1uGLvS7o8YAXczBOqhmKE4";
const SHEET_NAME="Data";
const query=encodeURIComponent("SELECT A, B, C WHERE A IS NOT NULL");
const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json&tq=${query}`;
let allData=[];
let filteredData=[];
let currentPage=1;
const perPage=20;

fetch(url).then(r=>r.text()).then(text=>{
const jsonText=text.substring(text.indexOf("{"),text.lastIndexOf("}")+1);
const data=JSON.parse(jsonText);
allData=data.table.rows.map(row=>{const cells=row.c||[];return{lembaga:cells[0]?.v||"",cabang:cells[1]?.v||"",sertifikat:cells[2]?.v||""};});
filteredData=allData;
renderData();
}).catch(error=>{console.error(error);document.getElementById("loading").innerHTML=`<div style="font-size:32px;margin-bottom:8px">⚠️</div>Gagal memuat data.<br><small>Pastikan Google Sheet dapat diakses publik.</small>`;});

function renderData(){
const loading=document.getElementById("loading"),table=document.getElementById("dataTable"),body=document.getElementById("dataBody"),empty=document.getElementById("empty"),pagination=document.getElementById("pagination"),pageInfo=document.getElementById("pageInfo");
loading.style.display="none"; body.innerHTML="";
if(!filteredData.length){table.style.display="none";pagination.style.display="none";pageInfo.style.display="none";empty.style.display="block";return;}
empty.style.display="none";table.style.display="table";
const totalPages=Math.ceil(filteredData.length/perPage); if(currentPage>totalPages) currentPage=totalPages;
const start=(currentPage-1)*perPage,end=start+perPage;
filteredData.slice(start,end).forEach(item=>{const tr=document.createElement("tr");tr.innerHTML=`<td><div class="nama">${escapeHTML(item.lembaga)}</div></td><td><span class="cabang">${escapeHTML(item.cabang)}</span></td><td>${item.sertifikat?`<a href="${escapeAttribute(item.sertifikat)}" target="_blank" rel="noopener noreferrer" class="download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>Download</a>`:`<span style="color:#999;font-size:12px">Belum tersedia</span>`}</td>`;body.appendChild(tr);});
renderPagination(totalPages); pageInfo.style.display="block";pageInfo.textContent=`Menampilkan ${start+1}–${Math.min(end,filteredData.length)} dari ${filteredData.length} data`;
}

function renderPagination(totalPages){
const pagination=document.getElementById("pagination");pagination.innerHTML="";
if(totalPages<=1){pagination.style.display="none";return;} pagination.style.display="flex";
const addBtn=(label,page,disabled=false,active=false)=>{const b=document.createElement("button");b.className="page-btn"+(active?" active":"");b.textContent=label;b.disabled=disabled;b.onclick=()=>{currentPage=page;renderData();window.scrollTo({top:0,behavior:"smooth"});};pagination.appendChild(b);};
addBtn("‹",currentPage-1,currentPage===1);
let pages=totalPages<=7?Array.from({length:totalPages},(_,i)=>i+1):[1,...(currentPage>3?["..."]:[]),...Array.from({length:Math.max(0,Math.min(totalPages-1,currentPage+1)-Math.max(2,currentPage-1)+1)},(_,i)=>Math.max(2,currentPage-1)+i),...(currentPage<totalPages-2?["..."]:[]),totalPages];
pages.forEach(p=>p==="..."?(()=>{const x=document.createElement("span");x.textContent="…";x.style.cssText="padding:0 4px;color:#699085";pagination.appendChild(x)})():addBtn(p,p,false,p===currentPage));
addBtn("›",currentPage+1,currentPage===totalPages);
}

document.getElementById("search").addEventListener("input",function(){const keyword=this.value.toLowerCase().trim();filteredData=allData.filter(item=>item.lembaga.toLowerCase().includes(keyword)||item.cabang.toLowerCase().includes(keyword));currentPage=1;renderData();});
function escapeHTML(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeAttribute(value){return String(value).replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
</script>
</body>
</html>
